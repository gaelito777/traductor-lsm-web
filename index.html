<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Traductor LSM</title>
  <!-- Librerías de MediaPipe y Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .main-container {
      position: relative;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }
    canvas {
      display: block;
      transform: scaleX(-1); /* Modo espejo como cv2.flip(img, 1) */
    }
    video {
      display: none;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // Variables globales (Replicando el script de Python)
    let textoFinal = "";
    let ultimaLetra = "";
    let tiempoLetra = 0;

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Dibujar fotograma de la cámara
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      const ancho = canvasElement.width;
      const alto = canvasElement.height;

      // ======================================
      // ENCABEZADO
      // ======================================
      canvasCtx.fillStyle = "rgb(35, 35, 35)";
      canvasCtx.fillRect(0, 0, ancho, 60);

      canvasCtx.save();
      canvasCtx.scale(-1, 1); // Compensar espejo para el texto
      canvasCtx.fillStyle = "#ffffff";
      canvasCtx.font = "bold 24px Arial";
      canvasCtx.fillText("Traductor LSM", -ancho + 20, 40);
      canvasCtx.restore();

      // ======================================
      // REGION DE INTERES (ROI)
      // ======================================
      const x1 = 150, y1 = 50;
      const x2 = 500, y2 = 400;

      canvasCtx.strokeStyle = "#ffffff";
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeRect(x1, y1, x2 - x1, y2 - y1);

      canvasCtx.save();
      canvasCtx.scale(-1, 1);
      canvasCtx.fillStyle = "#00ff00";
      canvasCtx.font = "16px Arial";
      canvasCtx.fillText("Coloque la mano dentro del recuadro", -x2, y1 + 20);
      canvasCtx.restore();

      let texto = "";

      // ======================================
      // SI SE DETECTA UNA MANO
      // ======================================
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const mano = results.multiHandLandmarks[0];

        // Dibujar Conexiones/Landmarks
        drawHandLandmarks(canvasCtx, mano, ancho, alto);

        // Obtener muñeca (punto 0)
        const xMuneca = mano[0].x * ancho;
        const yMuneca = mano[0].y * alto;

        // Validar ROI usando la posición de la muñeca
        if (!(x1 <= xMuneca && xMuneca <= x2 && y1 <= yMuneca && yMuneca <= y2)) {
          canvasCtx.save();
          canvasCtx.scale(-1, 1);
          canvasCtx.fillStyle = "#ff0000";
          canvasCtx.font = "bold 22px Arial";
          canvasCtx.fillText("MANO FUERA DE ROI", -ancho + 10, 260);
          canvasCtx.restore();
        } else {
          // Extraer lógica de estado de los dedos
          const dedos = [];
          
          // Pulgar
          const pulgarExtendido = Math.abs(mano[4].x - mano[2].x) > 0.04 ? 1 : 0;
          dedos.push(pulgarExtendido);

          // Índice, Medio, Anular, Meñique
          const tips = [8, 12, 16, 20];
          tips.forEach(tip => {
            dedos.push(mano[tip].y < mano[tip - 2].y ? 1 : 0);
          });

          const patron = dedos.join(',');

          // Mapeo de letras según el patrón de dedos
          if (patron === "1,0,0,0,0") texto = "A";
          else if (patron === "0,1,1,1,1") texto = "B";
          else if (patron === "0,1,0,0,0") texto = "D";
          else if (patron === "1,0,0,0,1") texto = "E";
          else if (patron === "0,0,1,1,1") texto = "F";
          else if (patron === "0,0,0,0,1") texto = "I";
          else if (patron === "0,0,0,0,0") texto = "S";
          else if (patron === "0,1,1,0,0") texto = "U";
          else if (dedos[0] === 1 && dedos[1] === 1 && dedos[2] === 0 && dedos[3] === 0 && dedos[4] === 0) texto = "L";

          // Mostrar letra detectada en vivo
          if (texto !== "") {
            canvasCtx.save();
            canvasCtx.scale(-1, 1);
            canvasCtx.fillStyle = "#00ffff";
            canvasCtx.font = "bold 32px Arial";
            canvasCtx.fillText("LETRA: " + texto, -ancho + 20, 120);
            canvasCtx.restore();

            // Guardar letra tras 1 segundo estable
            const ahora = Date.now() / 1000;
            if (texto !== ultimaLetra) {
              tiempoLetra = ahora;
              ultimaLetra = texto;
            } else if (ahora - tiempoLetra > 1.0) {
              textoFinal += texto;
              ultimaLetra = "";
            }
          }
        }
      }

      // ======================================
      // BARRA INFERIOR (TEXTO ACUMULADO)
      // ======================================
      canvasCtx.fillStyle = "rgb(35, 35, 35)";
      canvasCtx.fillRect(0, alto - 70, ancho, 70);

      canvasCtx.save();
      canvasCtx.scale(-1, 1);
      canvasCtx.fillStyle = "#ffffff";
      canvasCtx.font = "bold 20px Arial";
      canvasCtx.fillText("Texto generado:", -ancho + 20, alto - 40);

      canvasCtx.fillStyle = "#00ffff";
      canvasCtx.font = "bold 22px Arial";
      canvasCtx.fillText(textoFinal, -ancho + 210, alto - 40);
      canvasCtx.restore();

      canvasCtx.restore();
    }

    // Función auxiliar para dibujar los landmarks de la mano
    function drawHandLandmarks(ctx, landmarks, width, height) {
      ctx.fillStyle = "#00ff00";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;

      landmarks.forEach(lm => {
        const x = lm.x * width;
        const y = lm.y * height;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, 2 * Math.PI);
        ctx.fill();
      });
    }

    // Configuración de MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.9,
      minTrackingConfidence: 0.8
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();

    // Tecla R para reiniciar texto acumulado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        textoFinal = "";
        ultimaLetra = "";
      }
    });
  </script>
</body>
</html>
