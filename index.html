<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Traductor LSM - Web</title>
  <!-- CDN de MediaPipe Hands y Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #121212; 
      color: white; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
    }
    .container { 
      position: relative; 
      display: inline-block; 
      margin-top: 10px; 
    }
    canvas { 
      border: 3px solid #008cba; 
      border-radius: 8px; 
      transform: scaleX(-1); /* Modo espejo */
    }
    .banner { 
      background: #1e1e1e; 
      padding: 15px; 
      font-size: 24px; 
      margin-top: 15px; 
      border-radius: 8px; 
      display: inline-block; 
      min-width: 500px;
      border: 1px solid #333;
    }
    button { 
      margin-left: 20px; 
      padding: 8px 16px; 
      font-size: 16px; 
      background: #e74c3c; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
    }
    button:hover { background: #c0392b; }
    #estado { color: #2ecc71; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Traductor LSM en Tiempo Real</h1>
  <div id="estado">Iniciando cámara...</div>

  <div class="container">
    <video id="webcam" style="display:none;" playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <br>

  <div class="banner">
    Texto Generado: <span id="texto_final" style="color: #00ffff; font-weight: bold;"></span>
    <button onclick="limpiarTexto()">Reiniciar (R)</button>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const textoFinalElem = document.getElementById('texto_final');
    const estadoElem = document.getElementById('estado');

    let textoFinal = "";
    let ultimaLetra = "";
    let tiempoLetra = 0;

    function onResults(results) {
      estadoElem.innerText = "Sistema listo - Coloca tu mano en la cámara";
      
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Dibujar la imagen de la cámara
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Definir área activa (ROI ampliada)
      const roiX = 80;
      const roiY = 40;
      const roiWidth = 480;
      const roiHeight = 400;

      // Dibujar marco blanco de la ROI
      canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.8)";
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeRect(roiX, roiY, roiWidth, roiHeight);

      let letraDetectada = "";

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const landmarks = results.multiHandLandmarks[i];

          // Posición de la muñeca (Landmark 0)
          const munecaX = landmarks[0].x * canvasElement.width;
          const munecaY = landmarks[0].y * canvasElement.height;

          // Dibujar punto en la muñeca para feedback visual
          canvasCtx.fillStyle = "#ffff00";
          canvasCtx.beginPath();
          canvasCtx.arc(munecaX, munecaY, 6, 0, 2 * Math.PI);
          canvasCtx.fill();

          // Lógica de detección de estado de dedos (1 = extendido, 0 = doblado)
          let dedos = [];

          // Pulgar: comparamos X respecto a articulación previa
          const pulgarExtendido = Math.abs(landmarks[4].x - landmarks[2].x) > 0.04 ? 1 : 0;
          dedos.push(pulgarExtendido);

          // Índice, Medio, Anular, Meñique (comparando Y del tip respecto a la articulación PIP)
          const tips = [8, 12, 16, 20];
          tips.forEach(tip => {
            const extendido = landmarks[tip].y < landmarks[tip - 2].y ? 1 : 0;
            dedos.push(extendido);
          });

          // Mapeo de señas LSM
          const patron = dedos.join(',');
          
          if (patron === "1,0,0,0,0") letraDetectada = "A";
          else if (patron === "0,1,1,1,1") letraDetectada = "B";
          else if (patron === "0,1,0,0,0") letraDetectada = "D";
          else if (patron === "1,0,0,0,1") letraDetectada = "E";
          else if (patron === "0,0,1,1,1") letraDetectada = "F";
          else if (patron === "0,0,0,0,1") letraDetectada = "I";
          else if (patron === "0,0,0,0,0") letraDetectada = "S";
          else if (patron === "0,1,1,0,0") letraDetectada = "U";
          else if (dedos[0] === 1 && dedos[1] === 1 && dedos[2] === 0 && dedos[3] === 0 && dedos[4] === 0) letraDetectada = "L";

          // Mostrar letra detectada sobre la mano en el canvas
          if (letraDetectada !== "") {
            canvasCtx.save();
            canvasCtx.scale(-1, 1); // Deshacer efecto espejo solo para el texto
            canvasCtx.fillStyle = "#00ff00";
            canvasCtx.font = "bold 40px Arial";
            canvasCtx.fillText(letraDetectada, -munecaX - 20, munecaY - 30);
            canvasCtx.restore();
          }
        }
      }

      // Confirmar letra tras mantenerla 0.6 segundos
      if (letraDetectada !== "") {
        if (letraDetectada !== ultimaLetra) {
          tiempoLetra = Date.now();
          ultimaLetra = letraDetectada;
        } else if (Date.now() - tiempoLetra > 600) {
          textoFinal += letraDetectada;
          ultimaLetra = "";
          textoFinalElem.innerText = textoFinal;
        }
      }

      canvasCtx.restore();
    }

    // Inicializar MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    // Inicializar Cámara Web
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().catch(err => {
      estadoElem.innerText = "Error: Permite el acceso a la cámara en el navegador";
      estadoElem.style.color = "#e74c3c";
    });

    function limpiarTexto() {
      textoFinal = "";
      textoFinalElem.innerText = "";
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') limpiarTexto();
    });
  </script>
</body>
</html>
