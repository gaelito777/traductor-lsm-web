<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Traductor LSM - Web</title>
  <!-- CDN MediaPipe y Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f141d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 5px;
      font-size: 28px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }
    #estado {
      color: #a0aec0;
      font-size: 15px;
      margin-bottom: 25px;
    }
    /* Layout Lado a Lado */
    .layout-main {
      display: flex;
      flex-direction: row;
      gap: 25px;
      justify-content: center;
      align-items: stretch;
      max-width: 1200px;
      width: 100%;
    }
    /* Panel Izquierdo: Cámara */
    .panel-camara {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1a202c;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d3748;
    }
    .container-canvas {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #319795;
      box-shadow: 0 0 15px rgba(49, 151, 149, 0.3);
    }
    canvas {
      display: block;
      transform: scaleX(-1); /* Modo espejo */
    }
    .btn-reiniciar {
      margin-top: 15px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #2b6cb0, #2c5282);
      color: #ffffff;
      border: 1px solid #4299e1;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .btn-reiniciar:hover {
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(66, 153, 225, 0.5);
    }
    /* Panel Derecho: Texto Generado */
    .panel-texto {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1a202c;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d3748;
      min-width: 320px;
    }
    .panel-texto h2 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 15px;
      color: #e2e8f0;
    }
    .box-resultado {
      flex: 1;
      background: #0d1117;
      border-radius: 12px;
      border: 2px solid #00f2fe;
      box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.15), 0 0 15px rgba(0, 242, 254, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      word-break: break-all;
    }
    #texto_final {
      font-size: 54px;
      font-weight: 800;
      color: #00f2fe;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
      letter-spacing: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Traductor LSM en Tiempo Real</h1>
  <div id="estado">Iniciando cámara...</div>

  <div class="layout-main">
    <!-- Panel Izquierdo: Detección -->
    <div class="panel-camara">
      <div class="container-canvas">
        <video id="webcam" style="display:none;" playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
      </div>
      <button class="btn-reiniciar" onclick="limpiarTexto()">Reiniciar (R)</button>
    </div>

    <!-- Panel Derecho: Resultado -->
    <div class="panel-texto">
      <h2>Texto Generado</h2>
      <div class="box-resultado">
        <span id="texto_final"></span>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const textoFinalElem = document.getElementById('texto_final');
    const estadoElem = document.getElementById('estado');

    let textoFinal = "";
    let ultimaLetra = "";
    let tiempoLetra = 0;

    function onResults(results) {
      estadoElem.innerText = "Sistema Listo - Coloca tu mano en la cámara";
      
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Renderizar video
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Marco de ROI
      const roiX = 80;
      const roiY = 40;
      const roiWidth = 480;
      const roiHeight = 400;

      canvasCtx.strokeStyle = "rgba(0, 242, 254, 0.7)";
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeRect(roiX, roiY, roiWidth, roiHeight);

      let letraDetectada = "";

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const landmarks = results.multiHandLandmarks[i];

          const munecaX = landmarks[0].x * canvasElement.width;
          const munecaY = landmarks[0].y * canvasElement.height;

          // Indicador de muñeca
          canvasCtx.fillStyle = "#ffeb3b";
          canvasCtx.beginPath();
          canvasCtx.arc(munecaX, munecaY, 6, 0, 2 * Math.PI);
          canvasCtx.fill();

          // Detección de estado de los dedos
          let dedos = [];
          const pulgarExtendido = Math.abs(landmarks[4].x - landmarks[2].x) > 0.04 ? 1 : 0;
          dedos.push(pulgarExtendido);

          const tips = [8, 12, 16, 20];
          tips.forEach(tip => {
            const extendido = landmarks[tip].y < landmarks[tip - 2].y ? 1 : 0;
            dedos.push(extendido);
          });

          const patron = dedos.join(',');
          
          if (patron === "1,0,0,0,0") letraDetectada = "A";
          else if (patron === "0,1,1,1,1") letraDetectada = "B";
          else if (patron === "0,1,0,0,0") letraDetectada = "D";
          else if (patron === "1,0,0,0,1") letraDetectada = "E";
          else if (patron === "0,0,1,1,1") letraDetectada = "F";
          else if (patron === "0,0,0,0,1") letraDetectada = "I";
          else if (patron === "0,0,0,0,0") letraDetectada = "S";
          else if (patron === "0,1,1,0,0") letraDetectada = "U";
          else if (dedos[0] === 1 && dedos[1] === 1 && dedos[2] === 0 && dedos[3] === 0 && dedos[4] === 0) letraDetectada = "L";

          // Mostrar letra flotante sobre la mano en la cámara
          if (letraDetectada !== "") {
            canvasCtx.save();
            canvasCtx.scale(-1, 1);
            canvasCtx.fillStyle = "#00ff00";
            canvasCtx.font = "bold 38px Arial";
            canvasCtx.fillText(letraDetectada, -munecaX - 15, munecaY - 25);
            canvasCtx.restore();
          }
        }
      }

      // Confirmación de la letra
      if (letraDetectada !== "") {
        if (letraDetectada !== ultimaLetra) {
          tiempoLetra = Date.now();
          ultimaLetra = letraDetectada;
        } else if (Date.now() - tiempoLetra > 600) {
          textoFinal += letraDetectada;
          ultimaLetra = "";
          textoFinalElem.innerText = textoFinal;
        }
      }

      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().catch(err => {
      estadoElem.innerText = "Error: Permite el acceso a la cámara en el navegador";
      estadoElem.style.color = "#e53e3e";
    });

    function limpiarTexto() {
      textoFinal = "";
      textoFinalElem.innerText = "";
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') limpiarTexto();
    });
  </script>
</body>
</html>
